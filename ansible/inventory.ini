# App servers managed by Ansible.
# For a real VM replace ansible_host/ansible_port/ansible_user, for example:
#   app-server ansible_host=203.0.113.10 ansible_user=ubuntu
[app_servers]
app-server ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu

[app_servers:vars]
# Path to the control node's private key (the key itself is never committed)
ansible_ssh_private_key_file=~/.ssh/uni_devops_lab
